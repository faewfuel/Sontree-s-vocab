<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語帳 - คลังคำศัพท์ญี่ปุ่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Noto+Serif+Thai:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5EFE0; --paper-deep:#ECE3CC; --grid-line:#DFD3AE;
    --ink:#2A2725; --ink-soft:#726C5C;
    --shu:#C1402E; --shu-deep:#8F2C1F;
    --ai:#2C4A6E; --ai-soft:#e7edf3;
    --matcha:#4C7357; --matcha-soft:#e7efe8;
    --amber:#B8862E; --amber-soft:#f3e9d5;
    --card:#FFFDF7; --shadow:rgba(42,39,37,.14);
    --tierRed:#C1402E; --tierAmber:#B8862E; --tierGreen:#4C7357;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:linear-gradient(var(--grid-line) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:26px 26px;
    color:var(--ink); font-family:'Noto Sans Thai',sans-serif;
    min-height:100vh; padding:20px 14px 60px;
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px 16px;
    border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:16px;
  }
  header .jp{ font-family:'Shippori Mincho',serif; font-weight:800; font-size:clamp(1.3rem,5vw,1.9rem); letter-spacing:.03em;}
  header .th{ font-family:'Noto Serif Thai',serif; font-weight:700; color:var(--ink-soft); font-size:.9rem;}
  .backBtn{
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:.85rem;
    background:none; border:1px solid var(--grid-line); color:var(--ink-soft);
    border-radius:7px; padding:7px 14px; cursor:pointer; margin-bottom:14px;
  }
  .card{
    background:var(--card); border:1px solid var(--grid-line); border-radius:10px;
    box-shadow:0 4px 12px var(--shadow); padding:16px 18px; margin-bottom:14px;
  }
  .bigBtn{
    display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--grid-line);
    border-radius:10px; padding:16px 18px; margin-bottom:12px; cursor:pointer;
    font-family:'Noto Sans Thai',sans-serif; box-shadow:0 4px 12px var(--shadow);
  }
  .bigBtn .t1{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:1.15rem; color:var(--ink);}
  .bigBtn .t2{ color:var(--ink-soft); font-size:.85rem; margin-top:3px;}
  .primaryBtn{
    font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:.95rem;
    background:var(--shu); color:#fff; border:1px solid var(--shu-deep);
    border-radius:8px; padding:11px 20px; cursor:pointer;
  }
  .ghostBtn{
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:.85rem;
    background:none; color:var(--ink-soft); border:1px solid var(--grid-line);
    border-radius:7px; padding:8px 14px; cursor:pointer;
  }
  .dangerBtn{
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:.78rem;
    background:none; color:var(--shu-deep); border:1px solid var(--shu); opacity:.7;
    border-radius:7px; padding:6px 10px; cursor:pointer;
  }
  .chRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .chRow .info{ cursor:pointer; flex:1; }
  .chRow .name{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:1.1rem;}
  .chRow .count{ color:var(--ink-soft); font-size:.82rem; margin-top:2px;}

  textarea{
    width:100%; min-height:160px; font-family:'JetBrains Mono',monospace; font-size:.85rem;
    padding:12px; border:1px solid var(--grid-line); border-radius:8px; background:var(--paper);
    resize:vertical;
  }
  input[type=text]{
    width:100%; font-size:1rem; padding:9px 12px; border:1px solid var(--grid-line);
    border-radius:7px; background:var(--paper); font-family:'Noto Sans Thai',sans-serif;
  }
  label.fieldLabel{ display:block; font-size:.82rem; font-weight:700; color:var(--ink-soft); margin:12px 0 6px;}

  .reviewRow{ border-bottom:1px solid var(--grid-line); padding:10px 0; }
  .reviewRow.flagged{ background:var(--amber-soft); border-radius:6px; padding:10px 8px; }
  .reviewRow .jpPart{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:1.05rem;}
  .reviewRow .thPart{ color:var(--ink-soft); font-size:.88rem; margin:2px 0 6px;}
  .posChips{ display:flex; gap:6px; flex-wrap:wrap; }
  .posChips button{
    font-size:.74rem; font-family:'Noto Sans Thai',sans-serif; font-weight:600;
    border-radius:14px; padding:5px 12px; cursor:pointer; border:1px solid var(--grid-line);
    background:var(--paper-deep); color:var(--ink-soft);
  }
  .posChips button.sel[data-pos="kan"]{ background:var(--ai); color:#fff; border-color:var(--ai);}
  .posChips button.sel[data-pos="kwam"]{ background:var(--shu); color:#fff; border-color:var(--shu-deep);}
  .posChips button.sel[data-pos="none"]{ background:var(--matcha); color:#fff; border-color:var(--matcha);}

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .timer{ font-family:'JetBrains Mono',monospace; font-size:.9rem; color:var(--ink-soft);}
  nav.tabs{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  nav.tabs button{
    font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:.88rem;
    background:var(--paper-deep); color:var(--ink-soft);
    border:1px solid var(--grid-line); border-bottom:3px solid var(--grid-line);
    border-radius:6px 6px 0 0; padding:8px 14px; cursor:pointer;
  }
  nav.tabs button.active{ background:var(--card); color:var(--ink); border-color:var(--ink); border-bottom:3px solid var(--shu);}

  .progressRow{ display:flex; align-items:center; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:.85rem; color:var(--ink-soft); margin-bottom:12px;}
  .progressBar{ height:6px; background:var(--paper-deep); border-radius:4px; overflow:hidden; margin-bottom:16px;}
  .progressBar > div{ height:100%; background:var(--ai); transition:width .25s ease;}
  .promptLabel{ text-align:center; font-size:.8rem; letter-spacing:.06em; color:var(--shu-deep); font-weight:700; margin-bottom:6px;}
  .promptBox{
    text-align:center; border:2px dashed var(--grid-line); border-radius:10px; padding:24px 10px; margin-bottom:18px;
    background:repeating-linear-gradient(var(--card),var(--card) 25px, #F3EEDF 25px, #F3EEDF 26px);
  }
  .promptBox .big{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:clamp(2.2rem,9vw,3.2rem); line-height:1.1;}
  .fieldGrid{ display:grid; gap:12px; margin-bottom:16px;}
  @media(min-width:520px){ .fieldGrid{grid-template-columns:1fr 1fr;} }
  .field label{ display:block; font-size:.8rem; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input{ font-family:'Noto Sans JP','Noto Sans Thai',sans-serif;}
  .field input:disabled{ background:#F0EBDC; color:var(--ink-soft);}
  .stampRow{ display:flex; flex-direction:column; align-items:center; gap:6px; margin:6px 0 18px;}
  .stampBtn{
    width:92px; height:92px; border-radius:50%; border:3px double var(--shu); background:transparent; color:var(--shu);
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:1.1rem;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; transform:rotate(-6deg);
  }
  .stampBtn span.th{ font-family:'Noto Sans Thai',sans-serif; font-weight:600; font-size:.65rem;}
  .answerReveal{ background:var(--ai-soft); border:1px solid #c7d6e4; border-radius:8px; padding:14px 16px; margin-bottom:14px; display:none;}
  .answerReveal.show{ display:block; }
  .answerReveal .row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:4px; font-size:.96rem;}
  .answerReveal .row b{ color:var(--ai); min-width:78px; display:inline-block;}
  .posHint{ display:inline-block; margin-top:4px; font-size:.78rem; font-weight:700; padding:3px 9px; border-radius:12px;}
  .posHint.kan{ background:var(--ai); color:#fff;}
  .posHint.kwam{ background:var(--shu); color:#fff;}
  .markRow{ display:none; gap:10px; justify-content:center; margin-bottom:6px;}
  .markRow.show{ display:flex; }
  .markRow button{ font-family:'Noto Sans Thai',sans-serif; font-weight:700; font-size:.9rem; border-radius:7px; padding:9px 16px; cursor:pointer; border:1px solid transparent;}
  .markRow .correct{ background:var(--matcha-soft); color:var(--matcha); border-color:var(--matcha);}
  .markRow .wrong{ background:#f6e4e1; color:var(--shu-deep); border-color:var(--shu);}
  .noteSmall{ text-align:center; font-size:.76rem; color:var(--ink-soft); margin-top:6px;}
  .summaryScore{ text-align:center; font-family:'Shippori Mincho',serif; font-weight:800; font-size:1.9rem; margin-bottom:6px;}
  .summaryActions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
  .missedList table{ width:100%; border-collapse:collapse; font-size:.9rem;}
  .missedList td{ padding:6px 8px; border-bottom:1px solid var(--grid-line);}
  .searchRow input{ margin-bottom:12px;}
  table.vocab{ width:100%; border-collapse:collapse; font-size:.93rem;}
  table.vocab thead th{ text-align:left; font-weight:700; border-bottom:2px solid var(--ink); padding:7px 6px; position:sticky; top:0; background:var(--card);}
  table.vocab td{ padding:7px 6px; border-bottom:1px solid var(--grid-line); vertical-align:top;}
  table.vocab td.kanji{ font-family:'Shippori Mincho',serif; font-weight:600; font-size:1.02rem; white-space:nowrap;}
  table.vocab td.reading{ color:var(--ink-soft); white-space:nowrap;}
  .tableScroll{ max-height:60vh; overflow:auto; border:1px solid var(--grid-line); border-radius:8px;}

  .qCard{ background:var(--card); border:1px solid var(--grid-line); border-radius:10px; box-shadow:0 4px 12px var(--shadow); padding:16px 18px; margin-bottom:16px;}
  .qNum{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--shu-deep); font-size:.85rem; margin-bottom:8px;}
  .qRow{ display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .qRow .fLabel{ width:100px; flex-shrink:0; font-size:.82rem; font-weight:700; color:var(--ink-soft);}
  .qRow .given{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:1.2rem; background:var(--ai-soft); color:var(--ai); border-radius:6px; padding:6px 12px;}
  .qRow input{ flex:1; min-width:140px; }
  .taskLabel{ font-size:.8rem; font-weight:700; color:var(--shu-deep); margin:6px 0 8px;}

  .kanjiRow{ display:flex; gap:14px; flex-wrap:wrap; }
  .kanjiCell{ width:140px; }
  .cellBox{
    position:relative; width:140px; height:140px; border:2px dashed var(--grid-line); border-radius:8px; background:var(--paper); overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .cellBox::before, .cellBox::after{ content:""; position:absolute; background:var(--grid-line); opacity:.6; pointer-events:none; }
  .cellBox::before{ left:50%; top:0; bottom:0; width:1px; }
  .cellBox::after{ top:50%; left:0; right:0; height:1px; }
  .refSvg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .refSvg path{ fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .practiceCanvas{
    position:absolute; inset:0; width:100%; height:100%; cursor:crosshair;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .strokeBadge{ display:inline-block; font-family:'JetBrains Mono',monospace; font-size:.7rem; font-weight:700; color:#fff; border-radius:4px; padding:2px 8px; margin-bottom:5px;}
  .cellControls{ display:flex; flex-direction:column; gap:5px; margin-top:6px;}
  .cellControls .row{ display:flex; gap:5px; }
  .cellControls button{
    flex:1; font-size:.7rem; font-family:'Noto Sans Thai',sans-serif; font-weight:600;
    border:1px solid var(--grid-line); background:var(--paper-deep); color:var(--ink-soft); border-radius:6px; padding:6px 4px; cursor:pointer;
  }
  .cellControls button.playing{ background:var(--ai); color:#fff; border-color:var(--ai);}
  .cellControls button.revealed{ background:var(--shu); color:#fff; border-color:var(--shu-deep);}
  .cellControls button.erasing, .clearRow button.erasing{ background:var(--amber); color:#fff; border-color:#8f6a20;}
  .clearRow{ display:flex; margin-top:6px; }
  .clearRow button{
    flex:1; font-size:.7rem; font-family:'Noto Sans Thai',sans-serif; font-weight:600;
    border:1px solid var(--grid-line); background:var(--paper-deep); color:var(--ink-soft); border-radius:6px; padding:6px 4px; cursor:pointer;
  }
  .readingWrap{ margin-bottom:6px; }
  .readingBox{
    position:relative; height:96px; border:2px dashed var(--grid-line); border-radius:8px; background:var(--paper); overflow:hidden;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .readingBox::after{ content:""; position:absolute; left:8px; right:8px; top:50%; height:1px; background:var(--grid-line); opacity:.7; pointer-events:none; }
  .readingBox canvas{
    position:absolute; inset:0; width:100%; height:100%; cursor:crosshair;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .gradeArea{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--grid-line); }
  .correctAnswer{ font-size:.85rem; color:var(--shu-deep); margin-bottom:4px;}
  .selfMark{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .selfMark .smLabel{ font-size:.76rem; color:var(--ink-soft);}
  .selfMark button{
    font-size:.76rem; font-family:'Noto Sans Thai',sans-serif; font-weight:600; border-radius:6px; padding:5px 12px; cursor:pointer;
    border:1px solid var(--grid-line); background:var(--paper-deep); color:var(--ink-soft);
  }
  .selfMark button.on.yes{ background:var(--matcha); color:#fff; border-color:var(--matcha);}
  .selfMark button.on.no{ background:var(--shu); color:#fff; border-color:var(--shu-deep);}
  .submitBar{ position:sticky; bottom:14px; display:flex; justify-content:center; margin-top:10px;}
  .submitBtn{
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:.95rem; background:var(--shu); color:#fff;
    border:3px double #fff; outline:2px solid var(--shu-deep); border-radius:50%; width:88px; height:88px; cursor:pointer; box-shadow:0 6px 16px var(--shadow);
  }
  .scoreCard{ background:var(--card); border:1px solid var(--grid-line); border-radius:10px; box-shadow:0 6px 16px var(--shadow); padding:18px 20px; margin-bottom:18px; text-align:center;}
  .scoreCard .big{ font-family:'Shippori Mincho',serif; font-weight:800; font-size:1.5rem;}
  .scoreCard .sub{ color:var(--ink-soft); font-size:.85rem; margin-top:4px;}

  .loadingOverlay{
    position:fixed; inset:0; background:rgba(245,239,224,.94); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; z-index:50; font-family:'Noto Sans Thai',sans-serif; color:var(--ink-soft);
  }
  footer{ text-align:center; color:var(--ink-soft); font-size:.78rem; margin-top:22px; line-height:1.6;}
  @media (prefers-reduced-motion:reduce){ .refSvg path{ transition:none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

// ============== storage helpers ==============
// Uses standard browser localStorage so this works on any real web host
// (GitHub Pages, etc.), not just inside Claude.ai. Namespaced with 'vocabhub:'
// to avoid clashing with anything else that might share the same origin.
const LS_PREFIX = 'vocabhub:';
let storageAvailable = true;
async function getChapters(){
  try{ const v = localStorage.getItem(LS_PREFIX+'chapters'); return v ? JSON.parse(v) : []; }
  catch(e){ storageAvailable = false; return []; }
}
async function saveChapters(list){
  try{ localStorage.setItem(LS_PREFIX+'chapters', JSON.stringify(list)); }
  catch(e){ storageAvailable = false; }
}
async function getWords(chapterId){
  try{
    const v = localStorage.getItem(LS_PREFIX+'words:'+chapterId);
    if(v) return JSON.parse(v);
  }catch(e){ storageAvailable = false; }
  const seed = SEED_CHAPTERS.find(s=>s.id===chapterId);
  return seed ? seed.words : [];
}
async function saveWords(chapterId, words){
  try{ localStorage.setItem(LS_PREFIX+'words:'+chapterId, JSON.stringify(words)); }
  catch(e){ storageAvailable = false; }
}
async function deleteChapterData(chapterId){
  try{ localStorage.removeItem(LS_PREFIX+'words:'+chapterId); }catch(e){}
}

// ============== stroke cache (seeded + live KanjiVG fetch, cached forever) ==============
let strokeCacheMem = null;
async function loadStrokeCache(){
  if(strokeCacheMem) return strokeCacheMem;
  try{
    const v = localStorage.getItem(LS_PREFIX+'strokeCache');
    strokeCacheMem = v ? JSON.parse(v) : {};
  }catch(e){ strokeCacheMem = {}; }
  // SEED_STROKES is re-verified against KanjiVG every time this file is rebuilt, so it must
  // always override whatever a browser has cached from an earlier version of this file -
  // otherwise a stale/wrong cached entry can silently shadow a later data correction forever.
  for(const [ch,paths] of Object.entries(SEED_STROKES)){
    strokeCacheMem[ch] = paths;
  }
  return strokeCacheMem;
}
async function persistStrokeCache(){
  try{ localStorage.setItem(LS_PREFIX+'strokeCache', JSON.stringify(strokeCacheMem)); }
  catch(e){ storageAvailable = false; }
}
function isKanji(ch){ const cp = ch.codePointAt(0); return cp >= 0x4E00 && cp <= 0x9FFF; }
async function fetchStrokesLive(char){
  const code = char.codePointAt(0).toString(16).padStart(5,'0');
  try{
    const res = await fetch(`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${code}.svg`);
    if(!res.ok) return null;
    const text = await res.text();
    const entries = [...text.matchAll(/<path id="([^"]+)"[^>]*\sd="([^"]+)"/g)];
    entries.sort((a,b)=>{
      const na = parseInt((a[1].match(/-s(\d+)/)||[0,0])[1]) || 0;
      const nb = parseInt((b[1].match(/-s(\d+)/)||[0,0])[1]) || 0;
      return na-nb;
    });
    const paths = entries.map(e=>e[2]);
    return paths.length ? paths : null;
  }catch(e){ return null; }
}
async function prefetchStrokesForWords(words, onProgress){
  await loadStrokeCache();
  const need = new Set();
  for(const w of words) for(const ch of Array.from(w.k)) if(isKanji(ch) && !strokeCacheMem[ch]) need.add(ch);
  const list = [...need];
  if(list.length === 0) return;
  let done = 0;
  await Promise.all(list.map(async ch=>{
    const paths = await fetchStrokesLive(ch);
    if(paths) strokeCacheMem[ch] = paths;
    done++;
    if(onProgress) onProgress(done, list.length);
  }));
  persistStrokeCache();
}

// ============== import parser ==============
function guessPOS(kanji, reading){
  if(reading.endsWith('する') || kanji.endsWith('する')) return 'kan_check';
  const last = kanji[kanji.length-1];
  if(last === 'い' && kanji.length > 1) return 'none';
  const verbEnd = ['る','く','す','つ','む','ぬ','ぶ','ぐ','う'];
  const hasOkurigana = /[\u3040-\u309F]/.test(kanji.slice(1));
  if(verbEnd.includes(last) && hasOkurigana) return 'none';
  return 'noun_check';
}
function parseImportText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const words = [];
  for(const line of lines){
    const parts = line.split('\t');
    if(parts.length < 2) continue;
    const meaning = parts[0].trim();
    const jp = parts[1].trim();
    const jpParts = jp.split(/\s+/).filter(Boolean);
    const kanji = jpParts[0] || '';
    const reading = jpParts[1] || jpParts[0] || '';
    if(!kanji || !meaning) continue;
    const guess = guessPOS(kanji, reading);
    const pos = guess === 'kan_check' ? 'kan' : (guess === 'noun_check' ? 'kan' : 'none');
    const needsReview = guess === 'kan_check' || guess === 'noun_check';
    words.push({ k:kanji, r:reading, m:meaning, pos, needsReview });
  }
  return words;
}

// ============== canvas drawing (iPad-safe) ==============
function setupCanvas(canvas){
  const ctx = canvas.getContext('2d');
  let erasing = false;
  function resize(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=6; ctx.strokeStyle='#2A2725';
  }
  resize();
  let drawing=false, lastX=0, lastY=0;
  function pos(e){ const r = canvas.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  function widthFor(e){
    if(erasing) return 22;
    if(e.pointerType==='pen' && e.pressure>0) return 2+e.pressure*6;
    return 6;
  }
  canvas.addEventListener('pointerdown', e=>{
    e.preventDefault(); drawing=true; [lastX,lastY]=pos(e);
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  }, {passive:false});
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return; e.preventDefault();
    const [x,y]=pos(e);
    ctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
    ctx.lineWidth=widthFor(e);
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
    [lastX,lastY]=[x,y];
  }, {passive:false});
  canvas.addEventListener('pointerup', e=>{ e.preventDefault(); drawing=false; }, {passive:false});
  canvas.addEventListener('pointercancel', ()=> drawing=false, {passive:false});
  canvas.addEventListener('pointerleave', ()=> drawing=false);
  ['touchstart','touchmove','touchend'].forEach(evt=>{
    canvas.addEventListener(evt, e=> e.preventDefault(), {passive:false});
  });
  canvas.clearAll = () => ctx.clearRect(0,0,canvas.width,canvas.height);
  canvas.setErasing = (v) => { erasing = v; canvas.style.cursor = v ? 'cell' : 'crosshair'; };
  canvas.isErasing = () => erasing;
}
function tierColor(sc){ if(sc>=12) return 'var(--tierRed)'; if(sc>=9) return 'var(--tierAmber)'; return 'var(--tierGreen)'; }
function buildRefSvg(char){
  const paths = strokeCacheMem[char] || [];
  const pathEls = paths.map(d=>`<path d="${d}"/>`).join('');
  return `<svg class="refSvg" viewBox="0 0 109 109" xmlns="http://www.w3.org/2000/svg">${pathEls}</svg>`;
}
function setRefStatic(refSvgEl, mode){
  const paths = Array.from(refSvgEl.querySelectorAll('path'));
  paths.forEach(p=>{
    p.style.transition='none'; p.style.strokeDasharray='none'; p.style.strokeDashoffset='0';
    if(mode==='solid'){ p.style.stroke='var(--ink-soft)'; p.style.strokeWidth='2.6'; p.style.opacity='0.6'; }
    else { p.style.opacity='0'; }
  });
}
function playStrokeAnim(refSvgEl, revealedRef, onDone){
  const paths = Array.from(refSvgEl.querySelectorAll('path'));
  const lens = paths.map(p=>p.getTotalLength()||1);
  paths.forEach((p,i)=>{
    p.style.transition='none'; p.style.stroke='var(--ai)'; p.style.strokeWidth='3.4'; p.style.opacity='0.95';
    p.style.strokeDasharray=lens[i]; p.style.strokeDashoffset=lens[i];
  });
  const drawMs=380, gapMs=430;
  const startAt = paths.map((_,i)=>i*gapMs);
  const totalMs = paths.length ? startAt[startAt.length-1]+drawMs+250 : 0;
  const t0 = performance.now();
  function frame(now){
    const elapsed = now-t0;
    paths.forEach((p,i)=>{
      const local = elapsed-startAt[i];
      if(local<=0) p.style.strokeDashoffset=lens[i];
      else if(local>=drawMs) p.style.strokeDashoffset=0;
      else p.style.strokeDashoffset = lens[i]*(1-local/drawMs);
    });
    if(elapsed<totalMs) requestAnimationFrame(frame);
    else { setRefStatic(refSvgEl, revealedRef.value?'solid':'hidden'); if(onDone) onDone(); }
  }
  requestAnimationFrame(frame);
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function posHintHtml(pos){
  if(pos==='kan') return `<span class="posHint kan">ต้องมี "การ" นำหน้า</span>`;
  if(pos==='kwam') return `<span class="posHint kwam">ต้องมี "ความ" นำหน้า</span>`;
  return '';
}
function showLoading(msg){

  el.innerHTML = `<div style="font-family:'Shippori Mincho',serif;font-size:1.1rem;">読み込み中</div><div>${msg}</div>`;
  el.style.display='flex';
}

// ============== app state / router ==============
let appState = { screen:'home', chapters:[], currentChapterId:null, currentWords:[] };

async function boot(){
  appState.chapters = await getChapters();
  let changed = false;
  for(const seed of SEED_CHAPTERS){
    if(!appState.chapters.find(c=>c.id===seed.id)){
      await saveWords(seed.id, seed.words);
      appState.chapters.push({id:seed.id, name:seed.name, createdAt:Date.now()});
      changed = true;
    }
  }
  if(changed) await saveChapters(appState.chapters);
  await loadStrokeCache();
  render();
}
function goHome(){ appState.screen='home'; render(); }
function render(){
  const app = document.getElementById('app');
  if(appState.screen==='home') renderHome(app);
  else if(appState.screen==='addChapter') renderAddChapter(app);
  else if(appState.screen==='chapterMenu') renderChapterMenu(app);
  else if(appState.screen==='quiz') renderQuizScreen(app);
  else if(appState.screen==='write') renderWriteScreen(app);
  else if(appState.screen==='exam') renderExamScreen(app);
}

    return `
      <div class="card" id="wCard${wi}">
        <div class="qRow"><span class="fLabel" style="width:auto;font-family:'Shippori Mincho',serif;font-size:1.2rem;font-weight:700;color:var(--ink);" lang="ja">${w.r}</span></div>
        <div style="color:var(--ink-soft);font-size:.88rem;margin-bottom:10px;">${w.m}</div>
        <div class="kanjiRow">
          ${chars.map((ch,ci) => {
            const sc = (strokeCacheMem[ch]||[]).length;
            return `
            <div class="kanjiCell">
              <span class="strokeBadge" id="wbadge_${wi}_${ci}" style="background:${tierColor(sc)}; visibility:hidden;">${ch} ${sc||'?'}</span>
              <div class="cellBox">
                ${buildRefSvg(ch)}
                <canvas class="practiceCanvas" id="wc_${wi}_${ci}"></canvas>
              </div>
              <div class="cellControls">
                <button id="wplay_${wi}_${ci}">▶ ดูลำดับขีด</button>
                <button id="weraser_${wi}_${ci}">🧹 ยางลบ</button>
                <div class="row"><button id="wreveal_${wi}_${ci}">แสดงเฉลย</button><button id="wclear_${wi}_${ci}">↺ ล้างทั้งหมด</button></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
  words.forEach((w,wi) => {
    Array.from(w.k).filter(isKanji).forEach((ch,ci) => {
      const canvas = document.getElementById(`wc_${wi}_${ci}`);
      setupCanvas(canvas);
      const refSvg = canvas.parentElement.querySelector('.refSvg');
      const badge = document.getElementById(`wbadge_${wi}_${ci}`);
      const playBtn = document.getElementById(`wplay_${wi}_${ci}`);
      const eraserBtn = document.getElementById(`weraser_${wi}_${ci}`);
      const revealBtn = document.getElementById(`wreveal_${wi}_${ci}`);
      const clearBtn = document.getElementById(`wclear_${wi}_${ci}`);
      const revealedRef = {value:false};
      setRefStatic(refSvg, 'hidden');
      let animating=false;
      eraserBtn.onclick = () => {
        const on = !canvas.isErasing();
        canvas.setErasing(on);
        eraserBtn.classList.toggle('erasing', on);
      };
      revealBtn.onclick = () => {
        if(animating) return;
        revealedRef.value = !revealedRef.value;
        revealBtn.classList.toggle('revealed', revealedRef.value);
        setRefStatic(refSvg, revealedRef.value?'solid':'hidden');
        badge.style.visibility = revealedRef.value ? 'visible' : 'hidden';
      };
      playBtn.onclick = () => {
        if(animating) return;
        animating=true; playBtn.classList.add('playing');
        badge.style.visibility = 'visible';
        playStrokeAnim(refSvg, revealedRef, ()=>{ animating=false; playBtn.classList.remove('playing'); });
      };
      clearBtn.onclick = () => canvas.clearAll();
    });
  });
}

// ============== EXAM SCREEN (mock exam, handwriting, 5/5 split) ==============
function renderExamScreen(app){
  app.innerHTML = `
    <button class="backBtn" id="back">← กลับ</button>
    <header><div class="jp">模擬試験（手書き）</div><div class="th">จำลองข้อสอบ — เขียนมือ</div></header>
    <p style="color:var(--ink-soft);font-size:.85rem;margin:0 0 16px;line-height:1.6;">แบ่งตายตัวครึ่งหนึ่งให้เขียนคันจิ ครึ่งหนึ่งให้เขียนคำอ่าน สุ่มใหม่ทุกครั้ง เขียนด้วยนิ้ว/Apple Pencil ได้เลย</p>
    <div class="toolbar"><button class="primaryBtn" id="rollBtn">🎲 สุ่มข้อสอบชุดใหม่</button><span class="timer" id="timerDisplay">00:00</span></div>
    <div id="scoreArea"></div>
    <div id="examArea"></div>
    <div class="submitBar" id="submitBar" style="display:none;"><button class="submitBtn" id="submitBtn">提出<br><span style="font-family:'Noto Sans Thai',sans-serif;font-size:.6rem;">ส่งคำตอบ</span></button></div>
  `;
  document.getElementById('back').onclick = () => { stopTimer(); goHome(); };

  let exam=[], canvasRegistry={}, timerInterval=null, startTime=null;
  function formatTime(sec){ const m=String(Math.floor(sec/60)).padStart(2,'0'); const s=String(sec%60).padStart(2,'0'); return `${m}:${s}`; }
  function startTimer(){ clearInterval(timerInterval); startTime=Date.now(); timerInterval=setInterval(()=>{ const el=document.getElementById('timerDisplay'); if(el) el.textContent=formatTime(Math.floor((Date.now()-startTime)/1000)); },1000); }
  function stopTimer(){ clearInterval(timerInterval); }

  function newExam(){
    const words = appState.currentWords;
    const qCount = Math.min(10, words.length);
    const kCount = Math.ceil(qCount/2), rCount = qCount-kCount;
    const pick = shuffle(words).slice(0,qCount);
    const types = shuffle([...Array(kCount).fill('kanji'), ...Array(rCount).fill('reading')]);
    exam = pick.map((w,i)=>({...w, promptType:types[i]}));
    canvasRegistry={};
    document.getElementById('scoreArea').innerHTML='';
    document.getElementById('submitBar').style.display='flex';
    document.getElementById('timerDisplay').textContent='00:00';
    startTimer();
    renderExam();
  }
  function renderExam(){
    const el = document.getElementById('examArea');
    el.innerHTML = exam.map((q,i) => {
      const givenLabel = q.promptType==='kanji' ? 'คันจิ (โจทย์)' : 'คำอ่าน (โจทย์)';
      const givenText = q.promptType==='kanji' ? q.k : q.r;
      const taskLabel = q.promptType==='kanji' ? '✍️ เขียนคำอ่าน (ひらがな)' : '✍️ เขียนคันจิ';
      let bodyHtml;
      if(q.promptType==='reading'){
        const chars = Array.from(q.k).filter(isKanji);
        bodyHtml = `<div class="kanjiRow">` + chars.map((ch,ci) => {
          const sc = (strokeCacheMem[ch]||[]).length;
          return `
          <div class="kanjiCell">
            <span class="strokeBadge" id="badge_${i}_${ci}" style="background:${tierColor(sc)}; visibility:hidden;">${ch} ${sc}</span>
            <div class="cellBox">
              ${buildRefSvg(ch)}
              <canvas class="practiceCanvas" id="cv_${i}_${ci}"></canvas>
            </div>
            <div class="clearRow"><button id="eraser_${i}_${ci}">🧹 ยางลบ</button><button id="clear_${i}_${ci}">↺ ล้างทั้งหมด</button></div>
            <div class="cellControls" id="ctrl_${i}_${ci}" style="display:none;">
              <button class="playBtn" id="play_${i}_${ci}">▶ ดูลำดับขีด</button>
              <div class="row"><button id="reveal_${i}_${ci}">แสดงเฉลย</button></div>
            </div>
          </div>`;
        }).join('') + `</div>`;
      } else {
        const len = Array.from(q.r).length;
        const w = Math.min(420, Math.max(220, len*46));
        bodyHtml = `<div class="readingWrap"><div class="readingBox" style="width:${w}px;"><canvas id="cv_${i}_r"></canvas></div><div class="clearRow" style="max-width:${w}px;"><button id="eraser_${i}_r">🧹 ยางลบ</button><button id="clear_${i}_r">↺ ล้างทั้งหมด</button></div></div>`;
      }
      return `
        <div class="qCard" id="qCard${i}">
          <div class="qNum">ข้อที่ ${i+1}</div>
          <div class="qRow"><span class="fLabel">${givenLabel}</span><span class="given" lang="ja">${givenText}</span></div>
          <div class="taskLabel">${taskLabel}</div>
          ${bodyHtml}
          <div class="qRow" style="margin-top:12px;"><span class="fLabel">ความหมาย</span><input type="text" id="ansM${i}" autocomplete="off"></div>
          <div class="gradeArea" id="gradeArea${i}" style="display:none;"></div>
        </div>`;
    }).join('');
    exam.forEach((q,i) => {
      if(q.promptType==='reading'){
        Array.from(q.k).filter(isKanji).forEach((ch,ci) => {
          const canvas = document.getElementById(`cv_${i}_${ci}`);
          setupCanvas(canvas);
          canvasRegistry[`${i}_${ci}`] = {canvas, ch};
          const eBtn = document.getElementById(`eraser_${i}_${ci}`);
          eBtn.onclick = () => { const on=!canvas.isErasing(); canvas.setErasing(on); eBtn.classList.toggle('erasing', on); };
          document.getElementById(`clear_${i}_${ci}`).onclick = () => canvas.clearAll();
        });
      } else {
        const canvas = document.getElementById(`cv_${i}_r`);
        setupCanvas(canvas);
        canvasRegistry[`${i}_r`] = {canvas};
        const eBtn = document.getElementById(`eraser_${i}_r`);
        eBtn.onclick = () => { const on=!canvas.isErasing(); canvas.setErasing(on); eBtn.classList.toggle('erasing', on); };
        document.getElementById(`clear_${i}_r`).onclick = () => canvas.clearAll();
      }
    });
  }
  function gradeExam(){
    stopTimer();
    document.getElementById('submitBar').style.display='none';
    exam.forEach((q,i) => {
      if(q.promptType==='reading'){
        Array.from(q.k).filter(isKanji).forEach((ch,ci) => {
          const reg = canvasRegistry[`${i}_${ci}`];
          document.getElementById(`ctrl_${i}_${ci}`).style.display='flex';
          const badge = document.getElementById(`badge_${i}_${ci}`); if(badge) badge.style.visibility='visible';
          const refSvg = reg.canvas.parentElement.querySelector('.refSvg');
          const revealBtn = document.getElementById(`reveal_${i}_${ci}`);
          const playBtn = document.getElementById(`play_${i}_${ci}`);
          const revealedRef = {value:false};
          let animating=false;
          setRefStatic(refSvg,'hidden');
          revealBtn.onclick = () => {
            if(animating) return;
            revealedRef.value = !revealedRef.value;
            revealBtn.classList.toggle('revealed', revealedRef.value);
            setRefStatic(refSvg, revealedRef.value?'solid':'hidden');
          };
          playBtn.onclick = () => {
            if(animating) return;
            animating=true; playBtn.classList.add('playing');
            playStrokeAnim(refSvg, revealedRef, ()=>{ animating=false; playBtn.classList.remove('playing'); });
          };
        });
      }
      const drawnAnswerText = q.promptType==='reading' ? q.k : q.r;
      const drawnLabel = q.promptType==='reading' ? 'เฉลยคันจิ' : 'เฉลยคำอ่าน';
      document.getElementById(`ansM${i}`).disabled = true;
      const gradeArea = document.getElementById(`gradeArea${i}`);
      gradeArea.style.display='block';
      gradeArea.innerHTML = `
        <div class="correctAnswer">${drawnLabel}: <b lang="ja">${drawnAnswerText}</b></div>
        <div class="selfMark"><span class="smLabel">เขียนถูกไหม:</span><button data-k="write" data-v="yes">ถูก</button><button data-k="write" data-v="no">ผิด</button></div>
        <div class="correctAnswer">เฉลยความหมาย: <b>${q.m}</b> ${posHintHtml(q.pos)}</div>
        <div class="selfMark"><span class="smLabel">ความหมายถูกไหม:</span><button data-k="meaning" data-v="yes">ถูก</button><button data-k="meaning" data-v="no">ผิด</button></div>
      `;
    });
    document.querySelectorAll('.selfMark button').forEach(btn=>{
      btn.onclick = () => {
        const group = btn.parentElement;
        group.querySelectorAll('button').forEach(b=>b.classList.remove('on','yes','no'));
        btn.classList.add('on', btn.dataset.v);
        updateScoreSummary();
      };
    });
    updateScoreSummary();
  }
  function updateScoreSummary(){
    const writeYes = document.querySelectorAll('.selfMark button[data-k="write"].on.yes').length;
    const writeMarked = document.querySelectorAll('.selfMark button[data-k="write"].on').length;
    const meanYes = document.querySelectorAll('.selfMark button[data-k="meaning"].on.yes').length;
    const meanMarked = document.querySelectorAll('.selfMark button[data-k="meaning"].on').length;
    document.getElementById('scoreArea').innerHTML = `
      <div class="scoreCard">
        <div class="big">เขียนคันจิ/คำอ่าน ถูก ${writeYes} / ${writeMarked} ที่ประเมินแล้ว (จาก ${exam.length} ข้อ)</div>
        <div class="sub">ความหมายถูก ${meanYes} / ${meanMarked} ที่ประเมินแล้ว — เวลาที่ใช้: ${document.getElementById('timerDisplay').textContent}</div>
      </div>`;
  }
  document.getElementById('rollBtn').onclick = newExam;
  document.getElementById('submitBtn').onclick = gradeExam;
  newExam();
}

boot();
</script>
</body>
</html>
